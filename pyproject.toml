[project]
name = "agentope"
version = "0.1.0"
description = "Offline evaluation of LLM agent decisions, without logprobs"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.5",
    "scipy>=1.18.1",
]

[project.scripts]
agentope = "agentope.cli:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
